version: '3.8'

services:
  app:
    build:
      context: .
    container_name: java_app-sub
    ports:
      - "5050:8080"
    networks:
      - app-network
    environment:
      - SPRING_PROFILES_ACTIVE=prod  # Optional: Add any environment variables you need

  nginx:
    image: nginx:latest
    container_name: nginx_reverse_proxy
    ports:
      - "78:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf  # Bind your custom Nginx config
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
