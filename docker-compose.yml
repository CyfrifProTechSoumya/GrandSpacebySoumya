services:
  # Java application
  grandspace-java-app:
    build:
      context: .  # Current directory, which includes your Dockerfile
      dockerfile: Dockerfile
    ports:
      - "7171:8080"  # External 7171 maps to internal 8080 for the Java app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://grandspace-mysql-db:3306/mydb  # MySQL service name
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - grandspace-mysql-db  # Ensure MySQL starts before Java app
    networks:
      - app-network
    volumes:
      - ./target:/app  # Mount target directory (containing the .jar) to the container

  # MySQL Database
  grandspace-mysql-db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mydb
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "7272:3306"  # External MySQL port
    networks:
      - app-network

  # phpMyAdmin for MySQL management
  grandspace-phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "7373:80"  # External phpMyAdmin port
    environment:
      PMA_HOST: grandspace-mysql-db  # MySQL service name
      MYSQL_ROOT_PASSWORD: root
    networks:
      - app-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:latest
    ports:
      - "7474:80"  # External port for Nginx (front-facing)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf  # Custom Nginx config
    depends_on:
      - grandspace-java-app  # Ensure Java app starts before Nginx
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:

