server {
    listen 80;
    server_name www.grandspace.co.in;  # Your actual domain name

    # Reverse Proxy to the Java Application
    location / {
        proxy_pass http://grandspace-java-app:8080;  # Forward to the Java app container
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
