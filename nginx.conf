server {
    listen 80;
    server_name www.grandspace.co.in;  # Your actual domain name

    # Reverse Proxy to the Java Application
    location / {
        proxy_pass http://grandspace-java-app:8080;  # Forward to the Java app container on port 8080
        proxy_set_header Host $host;  # Pass the original host header to the Java app
        proxy_set_header X-Real-IP $remote_addr;  # Forward the real IP address of the client
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Forward any proxy chain IP addresses
        proxy_set_header X-Forwarded-Proto $scheme;  # Forward the protocol (HTTP or HTTPS)
    }

    # Optionally handle 404s
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }
    
    # Optionally handle 500 errors
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
